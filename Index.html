<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Träningslogg</title>
<style>
  :root {
    --bg: #f2f3f6; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e4e6eb;
    --accent: #0a7d4f; --accent-text: #ffffff; --soft: #e7f5ee; --danger: #c93a3a; --warn: #b7791f;
    --input: #f6f7f9; --input-border: #d7dae0; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #1a1d24; --text: #f1f2f4; --muted: #9aa0aa; --line: #2a2e37;
      --accent: #2fbf7f; --accent-text: #08110c; --soft: #17352a; --danger: #ff6b6b; --warn: #e0a84a;
      --input: #12151b; --input-border: #353a45; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, textarea { font: inherit; color: var(--text); }
  a { color: var(--accent); }

  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 12px; }
  .topbar h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .topbar .sub { color: var(--muted); font-size: 14px; }
  .iconbtn { min-width: 52px; height: 50px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px; color: var(--accent); font-weight: 600; font-size: 20px; padding: 0 14px; }
  .iconbtn:active { background: var(--soft); }
  .backbtn { height: 46px; min-width: 112px; padding: 0 18px; border: 1px solid var(--input-border); border-radius: 12px;
    color: var(--accent); font-weight: 600; font-size: 16px; background: var(--card); box-shadow: var(--shadow); }
  .backbtn:active { background: var(--soft); }

  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .stack > * + * { margin-top: 12px; }
  #exList > * + * { margin-top: 9px; }

  .passbtn { display: flex; width: 100%; text-align: left; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
  /* Passet som är "på tur" (det som inte kördes senast) får en liten grön rad "Nästa pass" under rubriken */
  .passbtn .duesub { color: color-mix(in srgb, var(--accent) 80%, var(--muted)); font-size: 12.5px; font-weight: 500; margin-top: 2px; }
  .passbtn .duesub.today { color: var(--accent); }
  .passbtn .duesub.dim { color: var(--muted); }   /* "Nästa pass" blir grått när ett pass redan är gjort idag */
  /* Statistik / Regler: lika höga som PASS-knapparna */
  #statsBtn, #rulesBtn { min-height: 77px; }
  .passbtn:active { transform: scale(.99); background: var(--soft); }
  .passbtn .big { font-size: 20px; font-weight: 700; }
  .passbtn .last { color: var(--muted); font-size: 14px; text-align: right; white-space: nowrap; line-height: 1.4; }
  .passbtn .last b { color: var(--text); font-weight: 700; }
  .passbtn .chev { color: var(--muted); font-size: 22px; margin-left: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quick { display: flex; flex-direction: column; justify-content: center; min-height: 58px; padding: 14px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: left; box-shadow: var(--shadow); }
  .quick:active { background: var(--soft); }
  .quick .t { font-weight: 600; }
  .quick .s { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--soft); color: var(--accent); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }

  details.rules summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.rules summary::-webkit-details-marker { display: none; }
  details.rules summary::after { content: "+"; color: var(--muted); font-size: 20px; }
  details.rules[open] summary::after { content: "–"; }
  details.rules p { color: var(--muted); font-size: 14px; margin: 10px 0 0; white-space: pre-wrap; }

  .foot { color: var(--muted); font-size: 13px; text-align: center; margin-top: 20px; line-height: 1.6; }

  /* Pass-vy */
  .datebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .datebar label { color: var(--muted); font-size: 14px; }
  input[type=date] { -webkit-appearance: none; appearance: none; background: var(--input); border: 1px solid var(--input-border);
    border-radius: 10px; padding: 8px 10px; min-height: 44px; font-size: 16px; font-weight: 600; }
  .editmode { font-size: 13px; color: var(--warn); font-weight: 600; }
  .datepill { background: var(--card) !important; border: 1px solid var(--line) !important; box-shadow: var(--shadow); border-radius: 12px !important;
    min-height: 49px !important; padding: 9px 14px !important; font-size: 17px !important; }

  .ex { padding: 6px 14px 5px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
  .ex input, .ex textarea { -webkit-user-select: text; user-select: text; }
  .ex.dragging { position: relative; z-index: 5; box-shadow: 0 10px 28px rgba(0,0,0,.2); border-color: var(--accent); background: var(--card); }
  .ex.dragging .name { color: var(--accent); }
  /* Avbockad övning: tonas ned med en mjuk övergång, allt går fortfarande att ändra */
  .ex, .fin { transition: opacity .25s ease, background-color .25s ease; }
  .ex.done, .fin.done { opacity: .40; background: color-mix(in srgb, var(--card) 52%, var(--bg)); }
  .donebox { flex: none; width: 20px; height: 20px; border-radius: 6.5px; border: 1.5px solid var(--input-border); background: var(--input);
    display: inline-flex; align-items: center; justify-content: center; color: transparent; margin-top: -1px; margin-bottom: -6px; transition: background-color .2s, border-color .2s, color .2s; }
  .donebox:active { transform: scale(.94); }
  .ex.done .donebox, .fin.done .donebox { background: var(--muted); border-color: var(--muted); color: var(--card); }
  .ex .head, .fin .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ex .name { font-weight: 700; font-size: 17px; line-height: 1.25; }
  .ex .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 2px; align-items: center; }
  .setcol { display: flex; flex-direction: column; gap: 3px; align-items: stretch; min-width: 0; }
  .setcol .rep { width: 100%; height: 23px; text-align: center; font-size: 14px; font-weight: 600; border-radius: 9px; color: var(--muted);
    background: var(--input); border: 1px solid var(--input-border); padding: 0 4px; }
  .setcol .rep:focus { outline: 2px solid var(--accent); border-color: transparent; color: var(--text); }
  .setcol .rep.changed { border-color: var(--accent); color: var(--text); }
  .setlbl { display: flex; gap: 8px; margin-top: 2px; }
  .set { width: 100%; height: 36px; text-align: center; font-size: 20px; font-weight: 600; border-radius: 12px;
    background: var(--input); border: 1px solid var(--input-border); padding: 0 4px; }
  .set:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .set.changed { border-color: var(--accent); background: var(--soft); }
  .textcell { width: 100%; min-height: 50px; font-size: 17px; border-radius: 12px; background: var(--input);
    border: 1px solid var(--input-border); padding: 10px 12px; margin-top: 10px; }

  textarea.note { width: 100%; min-height: 64px; resize: vertical; border-radius: 12px; background: var(--input);
    border: 1px solid var(--input-border); padding: 10px 12px; font-size: 16px; }
  .finisher { color: var(--text); font-size: 16px; line-height: 1.45; }
  .finisher b { color: var(--text); }

  .hist .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 12px 0; border-top: 1px solid var(--line); }
  .hist .item:first-of-type { border-top: 0; }
  .hist .d { font-weight: 600; min-width: 92px; }
  .hist .v { color: var(--muted); font-size: 14px; flex: 1; text-align: right; }
  .hist .v b { color: var(--text); font-size: 15px; }
  .hist .v.nodata { font-weight: 400; color: var(--muted); opacity: .8; padding-right: 2px; }
  .hist .item.active .d { color: var(--accent); }
  .more { width: 100%; text-align: center; color: var(--accent); padding: 10px; font-weight: 600; }
  /* Historiken är hopfälld som standard; rubriken är en knapp med pil som vänds när den öppnas */
  .histhead { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; font-weight: 700; padding: 2px 0; color: var(--text); }
  .histhead .cnt { color: var(--muted); font-weight: 500; font-size: 14px; }
  .histhead svg { color: var(--muted); flex: none; transition: transform .2s ease; }
  .histhead[aria-expanded="true"] svg { transform: rotate(180deg); }
  .histhead[aria-expanded="true"] { margin-bottom: 4px; }

  /* Spara · siffror · datum – knapp och datumfält har exakt samma höjd (explicit height på båda) */
  .saverow { display: flex; align-items: center; gap: 10px; }
  .saverow .primary { height: 46px; min-height: 0; min-width: 104px; padding: 0 16px; font-size: 16px; flex: none; border-radius: 12px; }
  .saverow .summa b, .saverow .summa span { font-variant-numeric: tabular-nums; }
  .saverow .summa { flex: 1; line-height: 1.15; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .saverow .summa b { font-size: 13px; white-space: nowrap; }
  .saverow .summa span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saverow .datepill { flex: none; height: 46px !important; min-height: 0 !important; box-sizing: border-box; padding: 0 12px !important; font-size: 16px !important; line-height: 44px; }
  .saverow .datepill::-webkit-calendar-picker-indicator { display: none; }
  .primary.saved { background: var(--soft); color: var(--accent); }
  #busy { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 45;
    background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; padding: 6px 12px 6px 10px; border-radius: 999px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  #busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #busy.wait { background: var(--warn); color: #fff; }
  #busy.wait::before { animation: none; border-right-color: currentColor; width: 8px; height: 8px; background: currentColor; }
  .syncbanner { background: var(--card); border: 1px solid var(--danger); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .syncbanner .t { font-weight: 700; color: var(--danger); }
  .syncbanner .r { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
  .syncbanner .r span { flex: 1; min-width: 0; }
  .syncbanner button { font-weight: 600; color: var(--accent); padding: 6px 8px; }
  .syncbanner button.del { color: var(--danger); }
  .primary { background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 17px; border-radius: 14px;
    height: 52px; padding: 0 26px; min-width: 130px; }
  .primary:disabled { opacity: .6; }
  .danger { color: var(--danger); font-weight: 600; padding: 10px 12px; border-radius: 10px; }
  .danger.confirm { background: var(--danger); color: #fff; }
  .ghost { color: var(--accent); font-weight: 600; padding: 10px 12px; }

  /* PIN */
  .pinwrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .pinwrap h1 { margin: 0 0 6px; }
  .pinwrap p { color: var(--muted); margin: 0 0 22px; }
  .dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 22px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
  .dot.on { background: var(--accent); border-color: var(--accent); }
  .pininput { font-size: 28px; letter-spacing: 12px; text-align: center; width: 180px; height: 56px; border-radius: 14px;
    background: var(--input); border: 1px solid var(--input-border); }
  .pinerr { color: var(--danger); min-height: 22px; margin-top: 10px; font-weight: 600; }

  /* Sheet (random/hemma) */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 10px; }
  .sheet .actions { display: flex; gap: 10px; margin-top: 14px; }
  .sheet .actions .primary { flex: 1; }
  .sheet .cancel { padding: 0 16px; color: var(--muted); font-weight: 600; }
  .sheet .lastlog { color: var(--muted); font-size: 14px; margin-top: 8px; }

  #toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; opacity: 0; transition: .25s; z-index: 30;
    max-width: 90vw; text-align: center; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--danger); color: #fff; }
  #loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); transform-origin: left;
    animation: load 1.2s ease-in-out infinite; z-index: 40; }
  @keyframes load { 0% { transform: scaleX(0); } 50% { transform: scaleX(.7); } 100% { transform: scaleX(1); opacity: 0; } }
  .center { text-align: center; color: var(--muted); padding: 40px 0; }

  /* Statistik */
  :root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --bar: #9ec5f4; --grid: #e6e7ea; }
  @media (prefers-color-scheme: dark) { :root { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --bar: #1c5cab; --grid: #2a2e37; } }
  .charthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .ctitle { font-weight: 700; }
  .csub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .segrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
  .seg { display: inline-flex; background: var(--input); border: 1px solid var(--input-border); border-radius: 10px; padding: 2px; }
  .seg button { padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 32px; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: inherit; font-size: 11px; fill: var(--muted); }
  .chart .grid line { stroke: var(--grid); stroke-width: 1; }
  .chart .axis line { stroke: var(--line); }
  .chart .ser { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { stroke: var(--card); stroke-width: 2; }
  .chart .lbl { font-weight: 600; fill: var(--text); }
  .chart .xh { stroke: var(--muted); stroke-dasharray: 3 3; }
  .chart .bar { rx: 0; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .tip { position: fixed; z-index: 35; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.15); pointer-events: none; white-space: nowrap; }
  .tip b { font-weight: 700; }
  .tip .r { display: flex; justify-content: space-between; gap: 12px; }
  .tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
  .sparks .sp { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .sparks .sp:first-child { border-top: 0; padding-top: 4px; }
  .sparks .nm { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .sparks .meta { text-align: right; }
  .sparks .meta .cur { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .sparks .meta .d { font-size: 12px; color: var(--muted); }
  .sparks .meta .d.up { color: var(--accent); font-weight: 600; }
  .sparks .meta .d.down { color: var(--danger); font-weight: 600; }
  .sparks .spl { position: absolute; left: 0; font-size: 10px; color: var(--muted); line-height: 1; pointer-events: none;
    background: color-mix(in srgb, var(--card) 80%, transparent); padding: 1px 3px; border-radius: 4px; }
  .mixbar { display: flex; height: 22px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--input); }
  .mixbar div { height: 100%; }

  /* Regler */
  .rsec .rh { font-weight: 700; font-size: 16px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .rsec .rh small { color: var(--muted); font-weight: 500; font-size: 13px; }
  .ritem { display: flex; gap: 10px; width: 100%; text-align: left; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.4; }
  .ritem::before { content: "•"; color: var(--accent); font-weight: 700; flex: none; }
  .ritem:active { background: var(--soft); }
  .redit { border-top: 1px solid var(--line); padding: 10px 0 4px; }
  .redit textarea { width: 100%; min-height: 72px; border-radius: 12px; background: var(--input); border: 1px solid var(--accent); padding: 10px 12px; font-size: 16px; resize: vertical; }
  .redit .acts { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  .redit .acts .primary { height: 42px; min-width: 100px; padding: 0 18px; font-size: 15px; }
  .addbtn { width: 100%; text-align: left; padding: 10px 0 2px; color: var(--accent); font-weight: 600; border-top: 1px solid var(--line); }

  /* Övningsinfo */
  .ex .headbtn, .fin .headbtn { text-align: left; flex: 1; min-width: 0; }
  .ex .name .pen { color: var(--muted); opacity: .6; margin-left: 8px; vertical-align: -1px; }
  .infoedit { margin-top: 8px; }
  .infoedit textarea { width: 100%; min-height: 64px; border-radius: 12px; background: var(--input); border: 1px solid var(--accent); padding: 10px 12px; font-size: 16px; resize: vertical; }
  .infoedit .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .infoedit .acts .primary { height: 40px; min-width: 90px; padding: 0 16px; font-size: 15px; }

  /* Random/Hemma-lista */
  .hist .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .hist .row:first-child { border-top: 0; }
  .hist .row .d { font-weight: 600; }
  .hist .row .wd { color: var(--muted); font-size: 13px; font-weight: 500; margin-left: 6px; }
  .hist .yr { display: flex; justify-content: space-between; align-items: baseline; color: var(--text); font-size: 18px; font-weight: 700;
    padding: 18px 0 6px; border-bottom: 2px solid var(--line); margin-top: 6px; }
  .hist .yr small { color: var(--muted); font-size: 13px; font-weight: 500; }
  .hist .yr:first-child { margin-top: 0; padding-top: 6px; }
  .hist .yr + .row { border-top: 0; }
  .pending { opacity: .6; }
  .flabel { display: block; color: var(--muted); font-size: 13px; }
  .chart .lbl.strong { fill: var(--text); }
  .hist .item .pend { font-size: 11px; color: var(--warn); font-weight: 600; margin-left: 6px; }
</style>
</head>
<body>
<div id="loading" hidden></div>

<!-- PIN -->
<section id="pinScreen" hidden>
  <div class="pinwrap">
    <h1>Träningslogg</h1>
    <p>Ange PIN</p>
    <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <input id="pinInput" class="pininput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" autofocus>
    <div class="pinerr" id="pinErr"></div>
  </div>
</section>

<!-- HEM -->
<section id="home" hidden>
  <div class="wrap">
    <div class="topbar">
      <div><h1 id="homeTitle">Träningslogg</h1><div class="sub" id="homeSub"></div></div>
      <button class="iconbtn" id="refreshBtn" title="Uppdatera">↻</button>
    </div>
    <div class="stack">
      <div id="syncBanner" hidden></div>
      <div class="stats" id="stats"></div>
      <div class="row2">
        <button class="quick" id="statsBtn"><div class="t">Statistik</div></button>

  { until: '2025-07-05', pattern: [12, 10, 10, 10] },
  { until: '2025-08-09', pattern: [12, 12, 10, 8] },

  triceps:     { 12: 1, 10: 1.538, 8: 1.875, 6: 1.925 },
  dip:         { 12: 1, 10: 1.509, 8: 1.697, 6: 1.905 },
  sidolyft:    { 12: 1, 10: 1.333, 8: 1.5,   6: 1.5 },
  kabelrodd:   { 12: 1, 10: 1.333, 8: 1.571, 6: 1.743 },
  axelpress:   { 12: 1, 10: 1.301, 8: 1.568, 6: 1.851 },
  flyes:       { 12: 1, 10: 1.834, 8: 2.449, 6: 3.077 },
  hantelpress: { 12: 1, 10: 1.286, 8: 1.571, 6: 1.597 },
  neddrag:     { 12: 1, 10: 1.236, 8: 1.361, 6: 1.528 },
  biceps:      { 12: 1, 10: 1.184, 8: 1.429, 6: 1.569 },

  kabelrodd: 'Kabelrodd med brett grepp', axelpress: 'Sittande axelpress maskin', flyes: 'Omvända flyes i maskin',
  hantelpress: 'Lutande hantelpress', neddrag: 'Neddrag stång (latsdrag)', biceps: 'Bicepscurl stång',

function factorKey(name) { return splitName(name).name.toLowerCase().replace(/[()]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' '); }

function exRefs(p) { return p.exercises.map((n, i) => (p.exIds && p.exIds[i]) || n); }
function repFactor(ref, r) {

// ---------- Poäng: alla övningar väger lika mycket ----------
// Steg 1 (ovan): varje set räknas om till 12-reps-ekvivalent → viktad volym per övning.
// Steg 2: varje övnings volym delas med samma övnings volym i passets FÖRSTA kompletta pass, så att en övning med
// låga vikter (t.ex. sidolyft) påverkar lika mycket som en tung (t.ex. dipmaskin).
// Poäng = S × snittet av kvoterna, där S = första passets viktade totalvolym (startpoängen blir alltså densamma som förut).

function exVolumes(sets, reps, names) { return sets.map((c, i) => cellVolume(c, (reps || [])[i], names ? names[i] : '')); }
function passNorm(p) {
  const base = p.entries.filter(x => x.row > 0 && isComplete(x.sets)).sort((a, b) => a.row - b.row)[0];
  if (!base) return null;
  const b = exVolumes(base.sets, base.reps, exRefs(p)), S = b.reduce((a, x) => a + x, 0);

}
/** Poäng för ett pass – null om passet saknar data i någon övning (så att det aldrig drar ner grafer/statistik). */
function entryVolume(e, p) {
  const v = scoreOf(e.sets, e.reps, p);

}
function fmtVol(v) { return Math.round(v).toLocaleString('sv-SE').replace(/ /g, ' '); }
function firstVolume(p) { const n = passNorm(p); return n ? n.S : null; }
function pctStr(v, base) { if (!(base && v > 0)) return ''; const d = Math.round((v / base - 1) * 100) || 0; return (d >= 0 ? '+' : '') + d + '%'; }
function volPctStr(p, v) { return pctStr(v, firstVolume(p)); }
/** "+30% · 6 156" – procenten i fetstil. Pass utan data → gråtext. */
function volLine(p, v, nodataText) { if (!v) return `<span style="opacity:.7">${esc(nodataText || 'utan data')}</span>`; const pc = volPctStr(p, v); return (pc ? `<b>${pc}</b> · ` : '') + fmtVol(v); }

}

function weekday(iso) { const [y,m,d] = iso.split('-').map(Number); return WEEKDAYS[new Date(y, m-1, d).getDay()]; }

function restore(snap) { model = JSON.parse(snap); }

// Allt som ska skrivas till sheetet läggs först i en kö i telefonen (localStorage) och visas direkt som sparat.
// Kön skickas i tur och ordning så fort det finns nät – även efter att appen stängts eller telefonen startats om
// (den ligger kvar tills Google bekräftat). Flera sparningar av samma pass slås ihop till den senaste versionen.
// Servern nycklar på datum (inte radnummer), så det stämmer även om rader flyttats under tiden.

function isTransientError(msg) {

// ------- Serverbrygga -------
// Inuti Apps Script används google.script.run. I den statiska appen (GitHub Pages) skickas samma anrop som JSON via fetch till doPost.
function call(fn, ...args) {
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e))[fn](...args);
    });
  }
  return callApi(fn, args);
}
async function callApi(fn, args) {
  if (!APP_URL) throw new Error('Ingen kontakt med Apps Script');
  let res;

    // text/plain → ingen CORS-preflight; Apps Script svarar via en redirect som fetch följer
    res = await fetch(APP_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, pin: args[0], args: args.slice(1) }) });
  } catch (e) { throw new Error('Ingen kontakt med servern'); }
  let j; try { j = await res.json(); } catch (e) { throw new Error('Oväntat svar från servern'); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'Något gick fel');
  return j.result;
}
async function api(fn, ...args) {
  loading(true);
  try { return await call(fn, pin, ...args); }
  catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    if (/Fel PIN/i.test(msg)) { forgetPin(); showPin('Fel PIN – försök igen'); }
    throw new Error(msg.replace(/^Error:\s*/, ''));
  } finally { loading(false); }
}

// ------- PIN -------
function storedPin() { try { return localStorage.getItem('tl_pin') || ''; } catch (e) { return ''; } }

// Bockade övningar (bara visuellt) sparas per pass + datum i localStorage, så de överlever passbyte, statistik-titt och omladdning.
// Gamla datum rensas bort vid start. Påverkar inte vad som sparas i sheetet.
let doneState = null;
function doneFor(key, date) {
  const today = todayStr();
  if (!doneState) {
    doneState = {};
    try { const s = JSON.parse(localStorage.getItem('tl_done') || '{}'); Object.keys(s).forEach(k => { doneState[k] = s[k]; }); } catch (e) {}
  }
  // Bockar från tidigare dagar rensas alltid (även om appen legat öppen över midnatt)
  let pruned = false; Object.keys(doneState).forEach(k => { if (k.split('|')[1] < today) { delete doneState[k]; pruned = true; } });
  if (pruned) { try { localStorage.setItem('tl_done', JSON.stringify(doneState)); } catch (e) {} }
  const k = key + '|' + date;

// ------- PASS -------
function openPass(key, entry) {
  const p = model.passes[key];
  const today = todayStr();

  const src = existingToday || latestByDate(p.entries);
  form = {
    pass: key,
    row: existingToday ? existingToday.row : null,
    origDate: existingToday ? existingToday.date : null,
    date: existingToday ? existingToday.date : today,
    note: existingToday ? (existingToday.note || '') : '',
    // Nytt pass: alltid set-rutor (fritext från ett gammalt pass förs inte över). Redigering: visa cellen som den är.
    ex: (p.exercises.length ? p.exercises : ['','','','','']).map((_, i) => {
      const parsed = parseCell(src ? src.sets[i] : '');
      const ex = (!existingToday && parsed.mode !== 'sets') ? { mode: 'sets', sets: [] } : parsed;
      return withReps(ex, src && ex.mode === 'sets' && parsed.mode === 'sets' ? (src.reps || [])[i] : '', existingToday ? existingToday.date : today);
    }),
    baseline: src ? src.sets.slice() : [],
    baselineReps: src ? (src.reps || []).slice() : [],
    showAll: form && form.pass === key ? form.showAll : false,
    histOpen: !!(entry && form && form.pass === key && form.histOpen), // hopfälld när man kommer från hem; kvar öppen när man klickar ett pass i listan
    infoEdit: null,
    done: [0, 1, 2, 3, 4].map(i => !!doneFor(key, existingToday ? existingToday.date : today).ex[i]), // bara visuellt: bockade övningar tonas ned, sparas inte i sheetet

function drawLineChart(container, series, opts) {
  const W = Math.max(280, container.clientWidth || 340), H = 340, ml = 46, mr = 16, mt = 14, mb = 26;
  const pts = series.flatMap(s => s.points);
  if (!pts.length) { container.innerHTML = '<div class="center" style="width:100%">Ingen data i valt spann</div>'; return; }
  let xmin = Math.min(...pts.map(p => p.x)), xmax = Math.max(...pts.map(p => p.x)); if (xmin === xmax) { xmin -= 864e5 * 7; xmax += 864e5 * 7; }
  xmax += (xmax - xmin) * 0.03; // lite luft för sista punkten
  let ymin = Math.min(...pts.map(p => p.y)), ymax = Math.max(...pts.map(p => p.y));
  if (opts.includeZero) { ymin = Math.min(0, ymin); ymax = Math.max(0, ymax); }
  let nt;
  if (opts.fixed) {
    let lo = opts.fixed.lo, hi = opts.fixed.hi; const st = opts.fixed.step;
    while (ymin < lo) lo -= st; while (ymax > hi) hi += st;
    const ticks = []; for (let v = lo; v <= hi + 1e-9; v += st) ticks.push(v);
    nt = { lo, hi, ticks };
  } else {
    const pad = (ymax - ymin) * 0.06 || 1; nt = niceTicks(ymin - pad, ymax + pad, 6);
  }
  const X = x => ml + (x - xmin) / (xmax - xmin) * (W - ml - mr), Y = y => mt + (nt.hi - y) / (nt.hi - nt.lo) * (H - mt - mb);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  g += '<g class="grid">' + nt.ticks.map(t => `<line x1="${ml}" x2="${W - mr}" y1="${Y(t)}" y2="${Y(t)}"${t === 0 && opts.includeZero ? ' style="stroke:var(--muted)"' : ''}/><text x="${ml - 6}" y="${Y(t) + 4}" text-anchor="end">${opts.fmt(t)}</text>`).join('') + '</g>';
  // x-ticks: kvartal; etikett vid årsskifte + juli (månadsvis vid korta spann)
  const d0 = new Date(xmin), d1 = new Date(xmax); const ticks = [];
  for (let y = d0.getFullYear(); y <= d1.getFullYear(); y++) for (let m = 0; m < 12; m += 3) { const t = new Date(y, m, 1).getTime(); if (t >= xmin && t <= xmax) ticks.push({ t, y, m }); }
  const spanDays = (xmax - xmin) / 864e5;
  if (spanDays < 200) { ticks.length = 0; for (let y = d0.getFullYear(); y <= d1.getFullYear(); y++) for (let m = 0; m < 12; m++) { const t = new Date(y, m, 1).getTime(); if (t >= xmin && t <= xmax) ticks.push({ t, y, m, monthly: true }); } }
  g += '<g class="axis">' + ticks.map(tk => `<line x1="${X(tk.t)}" x2="${X(tk.t)}" y1="${H - mb}" y2="${H - mb + 4}"/>` +
    ((tk.monthly || tk.m === 0 || tk.m === 6) ? `<text x="${X(tk.t)}" y="${H - mb + 16}" text-anchor="middle">${tk.m === 0 ? tk.y : (tk.monthly ? MONTHS[tk.m] : 'jul')}</text>` : '')).join('') + '</g>';
  // Punktstorlek efter täthet: små, kantlösa punkter så att täta pass ändå kan räknas
  const maxN = Math.max(...series.map(s => s.points.length));
  const pxPer = (W - ml - mr) / Math.max(1, maxN);
  const r = pxPer > 14 ? 3 : pxPer > 8 ? 2.4 : 1.9;
  series.forEach(s => {
    if (!s.points.length) return;
    const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
    const lp = s.points[s.points.length - 1];
    g += `<path class="ser" d="${d}" stroke="${s.color}" style="stroke-width:${pxPer > 8 ? 1.8 : 1.4}"/>`;
    g += s.points.slice(0, -1).map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${r}" fill="${s.color}"/>`).join('');
    g += `<circle cx="${X(lp.x)}" cy="${Y(lp.y)}" r="${r + 1.5}" fill="${s.color}"/>`;
    g += `<text class="lbl" x="${Math.min(X(lp.x) + 8, W - 44)}" y="${Y(lp.y) - 8}">${opts.fmt(lp.y)}</text>`;
  });
  g += `<line class="xh" id="xh" x1="0" x2="0" y1="${mt}" y2="${H - mb}" visibility="hidden"/>`;
  g += `<rect x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent" id="hit"/></svg>`;
  container.innerHTML = g;
  const svg = container.querySelector('svg'), xh = svg.querySelector('#xh'), hit = svg.querySelector('#hit');
  const move = (ev) => {
    const rc = svg.getBoundingClientRect(); const px = (ev.clientX - rc.left) * (W / rc.width);
    const xv = xmin + (px - ml) / (W - ml - mr) * (xmax - xmin);
    let best = null;
    series.forEach(s => s.points.forEach(p => { const dd = Math.abs(p.x - xv); if (!best || dd < best.dd) best = { dd, p }; }));
    if (!best) return;
    const rows = series.map(s => { const p = s.points.reduce((a, q) => Math.abs(q.x - best.p.x) < 864e5 * 4 && (!a || Math.abs(q.x - best.p.x) < Math.abs(a.x - best.p.x)) ? q : a, null);
      return p ? `<div class="r"><span><i style="--c:${s.color}"></i>${s.label}</span><b>${opts.fmt(p.y)}</b></div>` : ''; }).join('');
    xh.setAttribute('x1', X(best.p.x)); xh.setAttribute('x2', X(best.p.x)); xh.setAttribute('visibility', 'visible');
    showTip(`<b>${fmtDate(best.p.date, true)}</b>${rows}`, ev.clientX, ev.clientY);
  };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { xh.setAttribute('visibility', 'hidden'); hideTip(); });
}

function sparkline(pts) {

  const xs = pts.map(p => p.x), ys = pts.map(p => p.y), xmin = Math.min(...xs), xmax = Math.max(...xs), ymin = Math.min(...ys), ymax = Math.max(...ys);
  const X = x => 2 + (x - xmin) / ((xmax - xmin) || 1) * (W - 8), Y = y => 8 + (ymax - y) / ((ymax - ymin) || 1) * (H - 18);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const lp = pts[pts.length - 1];
  // min/max-etiketter (utanför svg:n så att texten inte sträcks) så att skalan går att läsa av
  const lbl = ymax !== ymin ? `<span class="spl" style="top:0">${fmtNum(ymax)}</span><span class="spl" style="bottom:0">${fmtNum(ymin)}</span>` : '';
  return `<div style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${X(lp.x)}" cy="${Y(lp.y)}" r="3.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/></svg>${lbl}</div>`;
}

function renderWeeks() {
  const dates = allDates(), t = todayStr(), bars = [];
  const end = mondayOf(t);
  let n = statsState.weekRange === 'all' ? 0 : Number(statsState.weekRange);
  if (!n) { const first = dates.length ? dates.reduce((a, b) => a < b ? a : b) : t; n = Math.round((end - mondayOf(first)) / (7 * 864e5)) + 1; }
  n = Math.max(1, Math.min(n, 520));
  const mon = new Date(end); mon.setDate(mon.getDate() - 7 * (n - 1));
  // Etiketter: ≤26 v -> varannan vecka, ≤52 -> var fjärde, annars bara årtal vid vecka 1
  const every = n <= 26 ? 2 : n <= 52 ? 4 : 0;
  for (let i = 0; i < n; i++) {
    const iso = isoOf(mon), wk = isoWeekKey(iso), no = weekNo(iso); const cnt = dates.filter(d => isoWeekKey(d) === wk).length;
    const yearLbl = no === 1 ? String(mon.getFullYear()) : '';
    bars.push({ label: every ? (yearLbl || 'v' + no) : yearLbl, strong: !!yearLbl, value: cnt, cur: i === n - 1, tip: `Vecka ${no} (${fmtDate(iso, true)}) · ${cnt} pass` });
    mon.setDate(mon.getDate() + 7);
  }
  drawBarChart($('weekChart'), bars, { every: every || 1, H: 230 });
}
function renderMonths() {
  const dates = allDates(), now = new Date(), bars = [];
  let n = statsState.monthRange === 'all' ? 0 : Number(statsState.monthRange);
  if (!n) { const first = dates.length ? dates.reduce((a, b) => a < b ? a : b) : todayStr(); const [fy, fm] = first.split('-').map(Number); n = (now.getFullYear() - fy) * 12 + (now.getMonth() + 1 - fm) + 1; }
  n = Math.max(1, Math.min(n, 120));
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1); const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const c = dates.filter(x => x.startsWith(key)).length;

    const label = n <= 12 ? MONTHS[d.getMonth()] : (d.getMonth() === 0 ? String(d.getFullYear()) : (d.getMonth() % 3 === 0 ? MONTHS[d.getMonth()] : ''));
    bars.push({ label, value: c, cur: i === 0, tip: `${MONTHS[d.getMonth()]} ${d.getFullYear()} · ${c} pass`, strong: d.getMonth() === 0 });

}
function drawBarChart(container, bars, opts) {
  const W = Math.max(280, container.clientWidth || 340), H = opts.H || 200, ml = 22, mr = 6, mt = 14, mb = 22;
  const max = Math.max(1, ...bars.map(b => b.value)); const nt = niceTicks(0, max, 3);
  const iw = (W - ml - mr) / bars.length, bw = Math.max(1.5, iw - Math.min(8, iw * 0.3));
  const Y = v => mt + (nt.hi - v) / (nt.hi || 1) * (H - mt - mb), y0 = Y(0);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  g += '<g class="grid">' + nt.ticks.filter(t => t > 0).map(t => `<line x1="${ml}" x2="${W - mr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${ml - 5}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`).join('') + '</g>';
  g += `<g class="axis"><line x1="${ml}" x2="${W - mr}" y1="${y0}" y2="${y0}"/></g>`;
  const maxIdx = bars.reduce((a, b, i) => b.value > bars[a].value ? i : a, 0);
  bars.forEach((b, i) => {
    const x = ml + i * iw + (iw - bw) / 2, top = Y(b.value), h = Math.max(0, y0 - top), r = Math.min(4, h, bw / 2);
    const d = h > 0 ? `M${x} ${y0} V${top + r} Q${x} ${top} ${x + r} ${top} H${x + bw - r} Q${x + bw} ${top} ${x + bw} ${top + r} V${y0} Z` : '';
    g += `<path class="bar" d="${d}" fill="${b.cur ? 'var(--s1)' : 'var(--bar)'}"/>`;
    if ((b.cur || i === maxIdx) && b.value > 0 && iw >= 6) g += `<text class="lbl" x="${x + bw / 2}" y="${top - 4}" text-anchor="middle">${b.value}</text>`;
    if (b.label && (b.strong || i % opts.every === (bars.length - 1) % opts.every)) g += `<text class="${b.strong ? 'lbl strong' : ''}" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${b.label}</text>`;
    g += `<rect x="${ml + i * iw}" y="${mt}" width="${iw}" height="${H - mt - mb}" fill="transparent" data-i="${i}"/>`;
  });
  g += '</svg>'; container.innerHTML = g;
  container.querySelectorAll('rect[data-i]').forEach(r => {
    const b = bars[+r.dataset.i];
    const f = (ev) => showTip(`<b>${b.tip}</b>`, ev.clientX, ev.clientY);
    r.addEventListener('pointermove', f); r.addEventListener('pointerdown', f); r.addEventListener('pointerleave', hideTip);
  });
}
function renderMix() {

  const y = statsState.mixYear;
  // PASS 1 + PASS 2 räknas som en gemensam stapel (gympass), Random och Hemma var för sig
  const parts = [['GYM', [...model.passes.P1.entries, ...model.passes.P2.entries], 'Gym', SER.P1.color], ['RANDOM', model.RANDOM, SER.RANDOM.label, SER.RANDOM.color], ['HEMMA', model.HEMMA, SER.HEMMA.label, SER.HEMMA.color]]

      ${rulesEdit && rulesEdit.s === s && rulesEdit.i === sec.items.length ? editBox('', s, sec.items.length) : `<button class="addbtn" data-add="${s}">+ Lägg till punkt</button>`}

function editBox(text, s, i) {

    <div class="acts">${i < model.guidelines[s].items.length ? '<button class="danger" data-act="del">Ta bort</button>' : '<span></span>'}

  commit('saveRules', [[{ row: g.row, heading: g.heading, items: g.items.slice() }]],
    () => { if (!$('rulesView').hidden && !rulesEdit) renderRules(); },
    () => { restore(snap); if (!$('rulesView').hidden) renderRules(); });
}
$('rulesBtn').addEventListener('click', showRules);
$('rulesBack').addEventListener('click', showHome);

// ------- Start -------
(async function init() {
  const p = PIN_FROM_URL || storedPin();
  if (!p) return showPin('');
  pin = p;
  // Finns en sparad modell i telefonen visas hemskärmen direkt; färskt data hämtas i bakgrunden och vyn ritas om om något ändrats
  const cached = cachedModel();
  if (cached) { model = cached; showHome(); } else loading(true);
  // getData autentiserar självt – inget separat checkPin-anrop
  if (cached) kickOutbox(); // osynkade ändringar från förra gången skickas först
  try { const fresh = await call('getData', p); rememberPin(p); if (cached) applyModel(fresh); else { model = fresh; persistModel(); showHome(); kickOutbox(); } }
  catch (e) {
    const bad = /Fel PIN/i.test(e.message || '');
    if (bad || !cached) { forgetPin(); showPin(bad ? 'Fel PIN' : (e.message || '')); }
    else toast('Ingen kontakt med servern – visar senast sparade data', true);
  }
  finally { loading(false); }
})();
</script>
